<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Books · LibraryOS</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><div class="brand-icon">L</div><div><strong>LibraryOS</strong><span>Management Dashboard</span></div></div>
    <nav><a href="/index.html">Dashboard</a><a class="active" href="/books.html">Books</a><a href="/members.html">Members</a><a href="/loans.html">Loans</a></nav>
    <div class="sidebar-footer"><span class="status-dot"></span> MySQL connected</div>
  </aside>
  <main class="main-content">
    <header class="topbar">
      <div><p class="eyebrow">CATALOGUE</p><h1>Books</h1></div>
      <button class="button" onclick="toggleForm()">+ Add Book</button>
    </header>

    <section id="bookForm" class="panel form-panel hidden">
      <div class="panel-heading"><div><p class="eyebrow">NEW RECORD</p><h2>Add Book</h2></div></div>
      <form id="addBookForm" class="form-grid">
        <label>ISBN<input name="isbn" required maxlength="20"></label>
        <label>Title<input name="title" required maxlength="150"></label>
        <label>Author<input name="author" required maxlength="100"></label>
        <label>Category<input name="category" required maxlength="50"></label>
        <label>Publisher<input name="publisher" maxlength="100"></label>
        <label>Publication Year<input name="publication_year" type="number" min="1000" max="9999"></label>
        <label>Total Copies<input name="total_copies" type="number" min="1" value="1" required></label>
        <div class="form-actions"><button class="button" type="submit">Save Book</button><button class="button secondary" type="button" onclick="toggleForm()">Cancel</button></div>
      </form>
    </section>

    <section class="panel">
      <div class="toolbar"><input id="bookSearch" class="search" placeholder="Search title, author or category…"><button class="button secondary" onclick="loadBooks()">Refresh</button></div>
      <div class="table-wrap">
        <table><thead><tr><th>ISBN</th><th>Title</th><th>Author</th><th>Category</th><th>Copies</th><th>Available</th><th>Action</th></tr></thead>
        <tbody id="booksTable"></tbody></table>
      </div>
    </section>
  </main>
</div>
<script src="/js/books.js"></script>
</body>
</html>
